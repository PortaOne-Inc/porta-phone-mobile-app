name: data
description: A new Flutter project.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.1.3 <4.0.0'
  flutter: ^3.13.6

dependencies:
  flutter:
    sdk: flutter

  # DI
  injectable: ^2.3.0
  get_it: ^7.6.4

  # Generators
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  freezed: ^2.4.3

  # Firebase
  firebase_core: ^2.16.0
  firebase_auth: ^4.10.0
  firebase_storage: ^11.2.6

  # HTTP
  dio: ^5.3.2

  domain:
    path: ../domain

  dto:
    git:
      url: https://github.com/WebTrit/webtrit_phone_configurator_common.git
      ref: develop
      path: packages/dto

dependency_overrides:
  # Generators
  freezed: 2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter
  flutter_lints: ^2.0.2

  # Generators
  flutter_gen_runner: ^5.3.1
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.0
  build_runner_core: ^7.2.9
  build_runner: ^2.4.6

flutter:
  generate: true
