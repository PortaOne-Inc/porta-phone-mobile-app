<!DOCTYPE html>
<html>
<head>
    <title>Webtrit configurator</title>
    <!-- Add Material Design styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/materialize@1.0.0/dist/css/materialize.min.css">
    <!-- Add custom styles -->
    <style>
		body {
			background-color: #f2f2f2;
			font-family: Arial, sans-serif;
		}
		.container {
			margin-top: 5%;
			text-align: center;
		}
		.card {
			padding: 50px;
			background-color: #fff;
			box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
			transition: 0.3s;
			margin: auto;
			max-width: 500px;
		}
		.card:hover {
			box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
		}
		.card-title {
			font-size: 36px;
			margin-bottom: 40px;
		}
		p {
			font-size: 18px;
			line-height: 1.5; /* add line-height for easier reading */
			margin-bottom: 20px; /* add some margin bottom for readability */
			color: #777; /* add color for lighter text */
		}
		.btn {
			color: #777;
			font-weight: bold;
			margin-top: 20px;
		}

	</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 class="card-title">Not found</h1>
        <p>Sorry, we couldn't find the page you're looking for. It's possible that the page has been removed, renamed, or is temporarily unavailable. Please check the URL and try again, or contact us if you think this is a mistake.</p>
        <a href="/" class="btn">Go to homepage</a>
    </div>
</div>
<!-- Add Material Design scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/materialize@1.0.0/dist/js/materialize.min.js"></script>
</body>
</html>
