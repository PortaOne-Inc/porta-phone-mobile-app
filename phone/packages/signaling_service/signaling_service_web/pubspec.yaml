name: signaling_service_web
description: Web implementation of the signaling_service plugin.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

flutter:
  plugin:
    implements: signaling_service
    platforms:
      web:
        pluginClass: WebtritSignalingServiceWeb
        fileName: signaling_service_web.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  signaling_service_platform_interface:
    path: ../signaling_service_platform_interface
  signaling:
    path: ../../signaling

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
