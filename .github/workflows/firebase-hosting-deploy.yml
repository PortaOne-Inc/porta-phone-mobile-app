name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    tags:
      - v*

env:
  FLUTTER_VERSION: 3.7.7
  FLUTTER_CHANNEL: 'stable'
  DART_VERSION: 2.19.6

  REPOSITORY_PHONE_NAME: WebTrit/webtrit_phone
  REPOSITORY_PHONE_BRANCH: feat/change_style_resource_temporary_for_actions
  REPOSITORY_PHONE_OUT_DIR: webtrit/webtrit_phone

  WORKING_DIRECTORY: webtrit/webtrit_configurator

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get main repository
        uses: actions/checkout@v3
        with:
          path: '${{env.WORKING_DIRECTORY}}'

      - name: Get phone repository
        uses: actions/checkout@v3
        with:
          repository: ${{env.REPOSITORY_PHONE_NAME}}
          ref: ${{env.REPOSITORY_PHONE_BRANCH}}
          path: ${{env.REPOSITORY_PHONE_OUT_DIR}}

      - name: Build Flutter Web project
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          dart --version: ${{env.DART_VERSION}}
          channel: ${{env.FLUTTER_CHANNEL}}

      - run: flutter pub get
        working-directory: ${{env.WORKING_DIRECTORY}}

      - run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Build prod web
        if: ${{github.event_name == 'push'&& github.ref == 'refs/heads/main' }}
        run: flutter build web --dart-define ENV="prod"
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Build stage web
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build web --dart-define ENV="dev"
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Archive artifacts
        uses: actions/upload-artifact@v2
        with:
          name: web-build
          path: ${{env.WORKING_DIRECTORY}}/build/web

  deploy:
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v2
        with:
          name: web-build
          path: firebase/public

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          entryPoint: "firebase"
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR_STAGE }}'
          projectId: webtrit-configurator-stage
          channelId: live
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          entryPoint: "firebase"
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR }}'
          projectId: webtrit-configurator
          channelId: live
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
