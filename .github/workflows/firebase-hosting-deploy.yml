name: Deploy to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to deploy'
        required: true
        default: 'main'
      phone_branch:
        description: 'Select branch for phone repository'
        required: true
        default: 'develop'
      callkeep_name:
        description: 'Select repository name for callkeep'
        required: true
        default: 'WebTrit/webtrit_callkeep'

env:
  FLUTTER_VERSION: 3.44.1
  FLUTTER_CHANNEL: 'stable'
  DART_VERSION: 3.12.1

  REPOSITORY_CONFIGURATOR_BRANCH: ${{ github.event.inputs.branch }}
  REPOSITORY_CONFIGURATOR_OUT_DIR: configurator

  REPOSITORY_PHONE_NAME: WebTrit/webtrit_phone
  REPOSITORY_PHONE_BRANCH: ${{ github.event.inputs.phone_branch }}
  REPOSITORY_PHONE_OUT_DIR: webtrit_phone

  REPOSITORY_CALLKEEP_NAME: ${{ github.event.inputs.callkeep_name }}
  REPOSITORY_CALLKEEP_BRANCH: main
  REPOSITORY_CALLKEEP_OUT_DIR: webtrit_callkeep

  WORKING_DIRECTORY: webtrit

  # Build commands
  # --no-tree-shake-icons: webtrit_phone uses a non-const IconData, which the icon tree-shaker rejects.
  BUILD_PROD_COMMAND: --release --no-tree-shake-icons --dart-define-from-file=launcher/prod.env.json
  BUILD_STAGE_COMMAND: --release --no-tree-shake-icons --dart-define-from-file=launcher/stage.env.json

  # Swagger generation commands
  SWAGGER_STAGE_COMMAND: --host=us-central1-webtrit-configurator-stage.cloudfunctions.net/api/v1 --scheme=https
  SWAGGER_PROD_COMMAND: --host=us-central1-webtrit-configurator.cloudfunctions.net/api/v1 --scheme=https

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 days'

  build_flutter_web:
    runs-on: ubuntu-latest
    needs: [ remove-old-artifacts ]

    steps:
      - name: Authenticate to GitHub Packages
        run: |
          echo "machine github.com login ${{ secrets.PAT_TOKEN }}" > ~/.netrc
          git config --global url."https://${{ secrets.GH_PAT }}:@github.com/".insteadOf "https://github.com/"

      - name: Get repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH }}
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}

      - name: Get phone repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ env.REPOSITORY_PHONE_NAME }}
          ref: ${{ env.REPOSITORY_PHONE_BRANCH }}
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_PHONE_OUT_DIR }}

      - name: Get callkeep repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ env.REPOSITORY_CALLKEEP_NAME }}
          ref: ${{ env.REPOSITORY_CALLKEEP_BRANCH }}
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CALLKEEP_OUT_DIR }}

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          version: ${{ env.FLUTTER_VERSION }}
          cache-sdk: true
          cache-key: true
          cache: true

      - name: Prepare phone project
        working-directory: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_PHONE_OUT_DIR }}
        run: |
          dart pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Prepare configurator project
        working-directory: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}
        run: |
          dart pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build prod web
        if: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH == 'main' }}
        run: flutter build web ${{ env.BUILD_PROD_COMMAND }}
        working-directory: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}

      - name: Build stage web
        if: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH != 'main' }}
        run: flutter build web ${{ env.BUILD_STAGE_COMMAND }}
        working-directory: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/build/web

  deploy-server-to-cloud-functions:
    runs-on: ubuntu-latest
    needs: [ remove-old-artifacts ]

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH }}
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}

      - name: Install cloud functions dependency
        run: npm install --save firebase-functions@latest
        working-directory: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase/functions

      - name: Generate swagger stage
        if: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH != 'main' }}
        run: node doc/swagger.ts ${{ env.SWAGGER_STAGE_COMMAND }}
        working-directory: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase/functions

      - name: Generate swagger prod
        if: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH == 'main' }}
        run: node doc/swagger.ts ${{ env.SWAGGER_PROD_COMMAND }}
        working-directory: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase/functions

      - name: Set up environment
        run: |
          echo "LOCALIZELY_DOWNLOAD_URL=${{ secrets.LOCALIZELY_DOWNLOAD_URL }}" >> ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase/functions/.env
          echo "LOCALIZELY_API_KEY=${{ secrets.LOCALIZELY_API_KEY }}" >> ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase/functions/.env

      - name: Deploy stage cloud functions
        if: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH != 'main' }}
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions:api
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR_STAGE }}
          PROJECT_PATH: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase
          PROJECT_ID: webtrit-configurator-stage

      - name: Deploy prod cloud functions
        uses: w9jds/firebase-action@master
        if: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH == 'main' }}
        with:
          args: deploy --only functions:api
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR }}
          PROJECT_PATH: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase
          PROJECT_ID: webtrit-configurator


  deploy_web_to_hosting:
    runs-on: ubuntu-latest
    needs: [ build_flutter_web ]

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ env.REPOSITORY_CONFIGURATOR_BRANCH }}
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}

      - name: Download artifacts
        uses: actions/download-artifact@v2
        with:
          name: web-build
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase/public

      - name: Deploy stage web to hosting
        if: ${{env.REPOSITORY_CONFIGURATOR_BRANCH != 'main'}}
        uses: docker://w9jds/firebase-action:master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR_STAGE }}
          PROJECT_PATH: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase
          PROJECT_ID: webtrit-configurator-stage

      - name: Deploy prod web to hosting
        uses: docker://w9jds/firebase-action:master
        if: ${{env.REPOSITORY_CONFIGURATOR_BRANCH == 'main'}}
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR }}
          PROJECT_PATH: ${{ env.WORKING_DIRECTORY }}/${{ env.REPOSITORY_CONFIGURATOR_OUT_DIR }}/firebase
          PROJECT_ID: webtrit-configurator
