name: Deploy to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to deploy'
        required: true
        default: 'main'

env:
  FLUTTER_VERSION: 3.22.0
  FLUTTER_CHANNEL: 'stable'
  DART_VERSION: 3.3.4

  REPOSITORY_PHONE_NAME: WebTrit/webtrit_phone
  REPOSITORY_PHONE_BRANCH: beta/develop
  REPOSITORY_PHONE_OUT_DIR: webtrit/webtrit_phone

  REPOSITORY_CALLKEEP_NAME: WebTrit/webtrit_callkeep
  REPOSITORY_CALLKEEP_BRANCH: main
  REPOSITORY_CALLKEEP_OUT_DIR: webtrit/webtrit_callkeep

  WORKING_DIRECTORY: webtrit/webtrit_configurator

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 days'

  build_flutter_web:
    runs-on: ubuntu-latest
    needs: [ remove-old-artifacts ]

    steps:
      - name: Get repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}
          path: '${{env.WORKING_DIRECTORY}}'

      - name: Get phone repository
        uses: actions/checkout@v3
        with:
          repository: ${{env.REPOSITORY_PHONE_NAME}}
          ref: ${{env.REPOSITORY_PHONE_BRANCH}}
          path: ${{env.REPOSITORY_PHONE_OUT_DIR}}

      - name: Get callkeep repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{env.REPOSITORY_CALLKEEP_NAME}}
          ref: ${{env.REPOSITORY_CALLKEEP_BRANCH}}
          path: ${{env.REPOSITORY_CALLKEEP_OUT_DIR}}

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: ${{env.FLUTTER_VERSION}}
          cache-sdk: true
          cache-key: true
          cache: true

      - name: Prepare phone project
        working-directory: ${{env.REPOSITORY_PHONE_OUT_DIR }}
        run: |
          dart pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Prepare configurator project
        working-directory: ${{env.WORKING_DIRECTORY }}
        run: |
          dart pub get
          flutter pub run build_runner build --delete-conflicting-outputs


      - name: Build prod web
        if: ${{github.event.inputs.branch == 'main'}}
        run: flutter build web --release --dart-define-from-file=launcher/prod.env.json
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Build stage web
        if: ${{github.event.inputs.branch != 'main'}}
        run: flutter build web --release --dart-define-from-file=launcher/stage.env.json
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Archive artifacts
        uses: actions/upload-artifact@v2
        with:
          name: web-build
          path: ${{env.WORKING_DIRECTORY}}/build/web

  deploy-server-to-cloud-functions:
    runs-on: ubuntu-latest
    needs: [ remove-old-artifacts ]
    steps:
      - name: Get repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}
          path: '${{env.WORKING_DIRECTORY}}'

      - name: Install cloud functions dependency
        run: npm install --save firebase-functions@latest
        working-directory: ${{env.WORKING_DIRECTORY}}/firebase/functions

      - name: Generate swagger stage
        if: ${{github.event.inputs.branch != 'main'}}
        run: node doc/swagger.ts --host=us-central1-webtrit-configurator-stage.cloudfunctions.net/api/v1 --scheme=https
        working-directory: ${{env.WORKING_DIRECTORY}}/firebase/functions

      - name: Generate swagger prod
        if: ${{github.event.inputs.branch == 'main'}}
        run: node doc/swagger.ts --host=us-central1-webtrit-configurator.cloudfunctions.net/api/v1 --scheme=https
        working-directory: ${{env.WORKING_DIRECTORY}}/firebase/functions

      - name: Deploy stage cloud functions
        if: ${{github.event.inputs.branch != 'main'}}
        uses: docker://w9jds/firebase-action:master
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR_STAGE }}
          PROJECT_PATH: ${{env.WORKING_DIRECTORY}}/firebase
          PROJECT_ID: webtrit-configurator-stage

      - name: Deploy prod cloud functions
        uses: docker://w9jds/firebase-action:master
        if: ${{github.event.inputs.branch == 'main'}}
        with:
          project_id: webtrit-configurator
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR }}
          PROJECT_PATH: ${{env.WORKING_DIRECTORY}}/firebase
          PROJECT_ID: webtrit-configurator

  deploy_web_to_hosting:
    runs-on: ubuntu-latest
    needs: [ build_flutter_web ]
    steps:
      - name: Get repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}
          path: '${{env.WORKING_DIRECTORY}}'

      - name: Download artifacts
        uses: actions/download-artifact@v2
        with:
          name: web-build
          path: ${{env.WORKING_DIRECTORY}}/firebase/public

      - name: Deploy stage web to hosting
        if: ${{github.event.inputs.branch != 'main'}}
        uses: docker://w9jds/firebase-action:master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR_STAGE }}
          PROJECT_PATH: ${{env.WORKING_DIRECTORY}}/firebase
          PROJECT_ID: webtrit-configurator-stage

      - name: Deploy prod web to hosting
        uses: docker://w9jds/firebase-action:master
        if: ${{github.event.inputs.branch == 'main'}}
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBTRIT_CONFIGURATOR }}
          PROJECT_PATH: ${{env.WORKING_DIRECTORY}}/firebase
          PROJECT_ID: webtrit-configurator