name: webtrit_configurator
description: A project that allows you to customize the style of the mobile application.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  #DI
  injectable: ^2.1.2
  get_it: ^7.6.0

  # Localization
  intl: ^0.18.0

  # Navigation
  go_router: ^7.1.1
  url_launcher: ^6.1.11

  # State manager
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3

  # Firebase
  firebase_core: ^2.14.0
  firebase_auth: ^4.6.3
  firebase_storage: ^11.2.3

  # UI
  device_preview: ^1.1.0
  responsive_framework: ^1.0.0
  flutter_hsvcolor_picker: ^1.2.3
  image_picker: ^0.8.9
  image_picker_for_web: ^2.2.0
  flutter_svg: ^2.0.7

  # Generators
  freezed_annotation: ^2.2.0
  freezed: ^2.3.5
  json_annotation: ^4.8.1
  flutter_launcher_icons: ^0.13.1

  # Helpers
  meta: ^1.9.0
  formz: ^0.6.0
  validated: ^2.0.0
  logging: ^1.2.0
  logging_appenders: ^1.1.0
  collection: ^1.17.0

  # Plugins for support phone module
  connectivity_plus: ^4.0.1
  google_fonts: ^4.0.3
  path: ^1.8.3
  infinite_scroll_pagination: ^3.2.0

  # HTTP
  dio: ^5.2.1+1

  # The main dependency of the configuration object
  screenshots:
    path: ../webtrit_phone/screenshots
  webtrit_phone:
    path: ../webtrit_phone

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.7.0
  injectable_generator: ^2.1.6
  bloc_test: ^9.1.3
  flutter_gen_runner: ^5.3.1
  flutter_lints: ^2.0.1
  build_runner: ^2.4.5

flutter:
  generate: true
  uses-material-design: true