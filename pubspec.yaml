name: webtrit_configurator
description: A project that allows you to customize the style of the mobile application.

publish_to: 'none'

version: 0.0.1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ^3.19.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  screenshots:
    path: ../webtrit_phone/screenshots
  webtrit_phone:
    path: ../webtrit_phone
  domain:
    path: ./packages/domain
  # TODO(Serdun): Try to remove data dependency from presentation now it used for providing env data for http client
  data:
    path: ./packages/data

  injectable: ^2.6.0
  get_it: ^9.0.5
  freezed_annotation: ^3.1.0
  freezed: ^3.2.3
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  intl: any
  go_router: ^17.0.0
  url_launcher: ^6.3.2
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  responsive_framework: ^1.5.1
  flutter_hsvcolor_picker: ^1.5.1
  file_picker: ^10.3.3
  flutter_svg: ^2.2.2
  formz: ^0.8.0
  google_fonts: ^6.3.2
  infinite_scroll_pagination: ^5.1.1
  screenshot: ^3.0.0
  characters: ^1.3.0
  collection: ^1.19.1
  path: ^1.9.1
  image_size_getter: ^2.4.1
  easy_debounce: ^2.0.3
  validated: ^2.0.0
  resizable_columns: ^0.0.2
  json_annotation: ^4.9.0
  logging: ^1.3.0
  logging_appenders: ^1.4.0+1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.0
  mime: ^2.0.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  webtrit_analysis:
    git: https://github.com/WebTrit/webtrit_analysis.git

  flutter_gen_runner: ^5.12.0
  injectable_generator: ^2.9.1
  build_runner: ^2.10.2
  json_serializable: ^6.11.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/themes/
    - assets/scheme/
    - assets/environment/
