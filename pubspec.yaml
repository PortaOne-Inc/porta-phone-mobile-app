name: webtrit_configurator
description: A project that allows you to customize the style of the mobile application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'
  flutter: ">=3.18.4"

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  injectable: ^2.4.1
  get_it: ^7.7.0
  freezed_annotation: ^2.4.1
  freezed: ^2.5.2
  firebase_core: ^2.26.0
  intl: ^0.19.0 
  go_router: ^14.1.3
  url_launcher: ^6.2.6
  bloc: ^8.1.4
  flutter_bloc: ^8.1.5
  responsive_framework: ^1.4.0
  flutter_hsvcolor_picker: ^1.5.0
  file_picker: ^8.0.3
  flutter_svg: ^2.0.10+1
  flex_color_scheme: ^7.3.1
  formz: 0.7.0
  google_fonts: ^6.2.1
  infinite_scroll_pagination: ^4.0.0
  screenshot: ^3.0.0
  characters: ^1.3.0
  collection: ^1.18.0
  path: ^1.9.0
  image_size_getter: ^2.1.3
  easy_debounce: ^2.0.3
  validated: ^2.0.0
  firebase_analytics: ^10.10.1

  screenshots:
    path: ../webtrit_phone/screenshots
  webtrit_phone:
    path: ../webtrit_phone
  domain:
    path: ./packages/domain
  data:
    path: ./packages/data

dependency_overrides:
  material_color_utilities: 0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  webtrit_analysis:
    git: https://github.com/WebTrit/webtrit_analysis.git
  flutter_gen_runner: ^5.4.0
  injectable_generator: ^2.6.1
  build_runner: ^2.4.9

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
