name: webtrit_configurator
description: A project that allows you to customize the style of the mobile application.

publish_to: 'none'

version: 0.0.3+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ^3.19.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  screenshots:
    path: ../webtrit_phone/screenshots
  webtrit_phone:
    path: ../webtrit_phone
  domain:
    path: ./packages/domain
  # TODO(Serdun): Try to remove data dependency from presentation now it used for providing env data for http client
  data:
    path: ./packages/data

  injectable: ^2.5.0
  get_it: ^8.0.3
  freezed_annotation: ^2.4.4
  freezed: ^2.5.7
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.6
  intl: any
  go_router: ^14.6.3
  url_launcher: ^6.3.1
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  responsive_framework: ^1.5.1
  flutter_hsvcolor_picker: ^1.5.1
  file_picker: ^8.1.6
  flutter_svg: ^2.0.16
  formz: ^0.7.0
  google_fonts: ^6.2.1
  infinite_scroll_pagination: ^4.1.0
  screenshot: ^3.0.0
  characters: ^1.3.0
  collection: ^1.18.0
  path: ^1.8.3
  image_size_getter: ^2.2.0
  easy_debounce: ^2.0.3
  validated: ^2.0.0
  resizable_columns: ^0.0.2
  json_annotation: ^4.9.0
  logging: ^1.2.0
  logging_appenders: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.4.0
  package_info_plus: ^8.3.0

dependency_overrides:
  material_color_utilities: 0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  webtrit_analysis:
    git: https://github.com/WebTrit/webtrit_analysis.git

  flutter_gen_runner: ^5.8.0
  injectable_generator: ^2.6.2
  build_runner: ^2.4.14
  json_serializable: ^6.9.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/themes/
    - assets/scheme/
    - assets/environment/
