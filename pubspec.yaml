name: webtrit_configurator
description: A project that allows you to customize the style of the mobile application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'
  flutter: ^3.13.6

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  #DI
  injectable: ^2.3.0
  get_it: ^7.6.4

  # Generators
  freezed_annotation: ^2.4.1
  freezed: ^2.4.1

  # Firebase
  firebase_core: ^2.22.0
  firebase_auth: ^4.10.0

  # Localization
  intl: ^0.18.0

  # Navigation
  go_router: ^12.1.1
  url_launcher: ^6.1.12

  # State manager
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3

  # UI
  device_preview: ^1.1.0
  responsive_framework: ^1.1.1
  flutter_hsvcolor_picker: ^1.5.0
  file_picker: ^6.1.1
  flutter_svg: ^2.0.7
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.1.0
  infinite_scroll_pagination: ^4.0.0

  # Tools
  screenshot: ^2.1.0
  characters: ^1.3.0
  collection: ^1.17.2
  path: ^1.8.3
  image_size_getter: ^2.1.2
  easy_debounce: ^2.0.3

  # Validation
  formz: ^0.6.1
  validated: ^2.0.0

  # The main dependency of the configuration object
  screenshots:
    path: ../webtrit_phone/screenshots

  webtrit_phone:
    path: ../webtrit_phone

  domain:
    path: ./packages/domain

  data:
    path: ./packages/data

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter
  flutter_lints: ^3.0.1

  # Generators
  flutter_gen_runner: ^5.3.1
  injectable_generator: ^2.4.0
  build_runner: ^2.4.6

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
